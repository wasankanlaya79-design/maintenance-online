<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หน้าช่างซ่อม</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#0f172a}.top{background:#7c2d12;color:#fff;padding:22px}.wrap{max-width:1000px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px}.field{padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.btn{padding:9px 12px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.item{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:10px}.muted{color:#64748b;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions textarea{min-height:70px}.full{grid-column:1/-1}.start{background:#d97706;color:#fff}.wait{background:#ea580c;color:#fff}.done{background:#166534;color:#fff}@media(max-width:700px){.actions{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="top"><div class="wrap" style="padding:0"><h1 style="margin:0">งานซ่อมของช่าง</h1><div>สำหรับช่างผู้ปฏิบัติงาน</div></div></div><main class="wrap"><section class="panel"><input id="name" class="field" placeholder="ชื่อช่าง" oninput="render()"> <button class="btn" onclick="loadJobs()">รีเฟรช</button><div id="list"></div></section></main><script>const db=supabase.createClient('https://qfchcxumnyazqdukikfj.supabase.co','sb_publishable_txBSRd3bUdLD55SOLebGoA_jC-Zmt3L');let jobs=[];const e=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function loadJobs(){const r=await db.from('maintenance_requests').select('*').eq('approval_status','approved').order('created_at',{ascending:false});jobs=r.data||[];render()}function render(){const n=document.getElementById('name').value.trim().toLowerCase();const a=jobs.filter(x=>!n||String(x.technician_name||'').toLowerCase().includes(n));document.getElementById('list').innerHTML=a.length?a.map(x=>'<div class="item"><b>'+e(x.ticket_no)+'</b><div class="muted">ช่าง: '+e(x.technician_name||'-')+' | สถานะ: '+e(x.status)+'</div><p><b>'+e(x.asset_name)+'</b> @ '+e(x.location)+'</p><p>'+e(x.problem_title)+'</p><div class="actions"><textarea class="field" id="c'+x.id+'" placeholder="สาเหตุ">'+e(x.cause||'')+'</textarea><textarea class="field" id="a'+x.id+'" placeholder="วิธีแก้ไข">'+e(x.action_taken||'')+'</textarea><div class="full"><button class="btn start" onclick="upd('+x.id+',\'in_progress\')">เริ่มซ่อม</button> <button class="btn wait" onclick="upd('+x.id+',\'waiting_part\')">รออะไหล่</button> <button class="btn done" onclick="finish('+x.id+')">ซ่อมเสร็จ</button></div></div></div>').join(''):'<p class="muted">ไม่มีงาน</p>'}async function upd(id,s){const p={status:s,cause:document.getElementById('c'+id).value,action_taken:document.getElementById('a'+id).value};if(s==='in_progress')p.started_at=new Date().toISOString();await db.from('maintenance_requests').update(p).eq('id',id);loadJobs()}async function finish(id){const c=document.getElementById('c'+id).value.trim(),a=document.getElementById('a'+id).value.trim();if(!c||!a){alert('กรุณากรอกสาเหตุและวิธีแก้ไข');return}await db.from('maintenance_requests').update({status:'completed',cause:c,action_taken:a,completed_at:new Date().toISOString()}).eq('id',id);loadJobs()}loadJobs()</script></body></html>
