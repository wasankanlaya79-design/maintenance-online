<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ผู้แจ้งซ่อม | ระบบแจ้งซ่อมออนไลน์</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,"Noto Sans Thai",sans-serif;margin:0;background:#f5f7fb;color:#0f172a}.top{background:#0f766e;color:#fff;padding:22px}.wrap{max-width:960px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:700;font-size:13px}input,select,textarea,button{font:inherit}.field{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:10px}textarea{min-height:90px}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#0f766e;color:white}.secondary{background:#e2e8f0}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#e2e8f0;font-weight:800;font-size:12px}.item{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px}.muted{color:#64748b;font-size:13px}.ok{color:#166534}.bad{color:#991b1b}@media(max-width:680px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="top"><div class="wrap" style="padding:0"><h1 style="margin:0">แจ้งซ่อมและติดตามสถานะ</h1><div>สำหรับผู้แจ้งซ่อม</div></div></div><main class="wrap"><section class="panel"><h2>แจ้งซ่อมใหม่</h2><form id="f" class="grid"><div><label>ชื่อผู้แจ้ง</label><input class="field" name="requester_name" required></div><div><label>แผนก</label><input class="field" name="department" required></div><div><label>เบอร์โทร</label><input class="field" name="phone"></div><div><label>สถานที่</label><input class="field" name="location" required></div><div><label>รหัสเครื่องจักร</label><input class="field" name="asset_code"></div><div><label>ชื่อเครื่องจักร/อุปกรณ์</label><input class="field" name="asset_name" required></div><div class="full"><label>หัวข้อปัญหา</label><input class="field" name="problem_title" required></div><div class="full"><label>รายละเอียดอาการ</label><textarea class="field" name="problem_detail"></textarea></div><div><label>ความเร่งด่วน</label><select class="field" name="priority"><option value="normal">ปกติ</option><option value="high">สูง</option><option value="urgent">เร่งด่วนมาก</option><option value="low">ต่ำ</option></select></div><div style="align-self:end"><button class="btn primary" type="submit">ส่งใบแจ้งซ่อม</button></div></form><div id="msg" class="muted" style="margin-top:10px"></div></section><section class="panel"><h2>ติดตามสถานะ</h2><div class="grid"><input id="ticket" class="field" placeholder="กรอกเลขงาน เช่น MR-20261001-1234"><button class="btn secondary" onclick="track()">ค้นหาสถานะ</button></div><div id="result"></div></section></main><script>const URL='https://qfchcxumnyazqdukikfj.supabase.co',KEY='sb_publishable_txBSRd3bUdLD55SOLebGoA_jC-Zmt3L',db=supabase.createClient(URL,KEY);const st={new:'รออนุมัติ',accepted:'อนุมัติ/มอบหมายแล้ว',in_progress:'กำลังซ่อม',waiting_part:'รออะไหล่',completed:'ซ่อมเสร็จ',cancelled:'ยกเลิก'};const ap={pending:'รออนุมัติ',approved:'อนุมัติ',rejected:'ไม่อนุมัติ'};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=v=>v?new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Bangkok'}).format(new Date(v)):'-';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.ticket_no='MR-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.floor(1000+Math.random()*9000);d.status='new';d.approval_status='pending';const {error}=await db.from('maintenance_requests').insert(d);const m=document.getElementById('msg');if(error){m.className='bad';m.textContent='บันทึกไม่สำเร็จ: '+error.message;return}m.className='ok';m.textContent='บันทึกสำเร็จ เลขงาน '+d.ticket_no+' กรุณาจดเลขนี้ไว้ติดตามสถานะ';document.getElementById('ticket').value=d.ticket_no;e.target.reset();track()});async function track(){const t=document.getElementById('ticket').value.trim();if(!t)return;const {data,error}=await db.from('maintenance_requests').select('*').eq('ticket_no',t).maybeSingle();const r=document.getElementById('result');if(error||!data){r.innerHTML='<div class="item bad">ไม่พบเลขงานนี้</div>';return}r.innerHTML='<div class="item"><b>'+esc(data.ticket_no)+'</b><div class="muted">แจ้งเมื่อ '+fmt(data.created_at)+'</div><p><b>เครื่อง:</b> '+esc(data.asset_name)+' | <b>จุด:</b> '+esc(data.location)+'</p><p><b>ปัญหา:</b> '+esc(data.problem_title)+'</p><p><b>การอนุมัติ:</b> <span class="status">'+esc(ap[data.approval_status]||data.approval_status)+'</span></p><p><b>สถานะงาน:</b> <span class="status">'+esc(st[data.status]||data.status)+'</span></p><p><b>ผู้อนุมัติ:</b> '+esc(data.approved_by||'-')+' | <b>ช่าง:</b> '+esc(data.technician_name||'-')+'</p>'+(data.rejection_reason?'<p><b>เหตุผลไม่อนุมัติ:</b> '+esc(data.rejection_reason)+'</p>':'')+(data.completed_at?'<p><b>ปิดงาน:</b> '+fmt(data.completed_at)+'</p>':'')+'</div>'}</script></body></html>
