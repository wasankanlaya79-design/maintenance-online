<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ผู้อนุมัติ | ระบบแจ้งซ่อมออนไลน์</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,"Noto Sans Thai",sans-serif;margin:0;background:#f5f7fb;color:#0f172a}.top{background:#1e3a8a;color:#fff;padding:22px}.wrap{max-width:1080px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea,button{font:inherit}.field{padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px}.btn{padding:9px 12px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.approve{background:#166534;color:#fff}.reject{background:#991b1b;color:#fff}.assign{background:#1d4ed8;color:#fff}.ghost{background:#e2e8f0}.item{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions input{min-width:180px}@media(max-width:700px){.actions>*{width:100%}}</style></head><body><div class="top"><div class="wrap" style="padding:0"><h1 style="margin:0">อนุมัติและมอบหมายงานซ่อม</h1><div>สำหรับผู้อนุมัติ / หัวหน้าช่าง</div></div></div><main class="wrap"><section class="panel"><div class="toolbar"><input id="search" class="field" placeholder="ค้นหาเลขงาน/เครื่องจักร/ผู้แจ้ง"><select id="filter" class="field"><option value="pending">รออนุมัติ</option><option value="approved">อนุมัติแล้ว</option><option value="rejected">ไม่อนุมัติ</option><option value="all">ทั้งหมด</option></select><button class="btn ghost" onclick="load()">รีเฟรช</button></div><div id="list"></div></section></main><script>const URL='https://qfchcxumnyazqdukikfj.supabase.co',KEY='sb_publishable_txBSRd3bUdLD55SOLebGoA_jC-Zmt3L',db=supabase.createClient(URL,KEY);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=v=>v?new Intl.DateTimeFormat('th-TH',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Bangkok'}).format(new Date(v)):'-';document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);let rows=[];async function load(){const {data,error}=await db.from('maintenance_requests').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}rows=data||[];render()}function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;let a=rows.filter(x=>f==='all'||x.approval_status===f).filter(x=>[x.ticket_no,x.asset_name,x.requester_name,x.problem_title].join(' ').toLowerCase().includes(q));document.getElementById('list').innerHTML=a.length?a.map(x=>'<div class="item"><div class="row"><div><b>'+esc(x.ticket_no)+'</b><div class="muted">'+fmt(x.created_at)+' | ผู้แจ้ง '+esc(x.requester_name)+' / '+esc(x.department)+'</div></div><span class="pill">'+esc(x.approval_status||'pending')+'</span></div><p><b>'+esc(x.asset_name)+'</b> @ '+esc(x.location)+'</p><p>'+esc(x.problem_title)+'<br><span class="muted">'+esc(x.problem_detail||'')+'</span></p><div class="actions"><input class="field" id="approver-'+x.id+'" placeholder="ชื่อผู้อนุมัติ" value="'+esc(x.approved_by||'')+'"><input class="field" id="tech-'+x.id+'" placeholder="ชื่อช่างที่จะมอบหมาย" value="'+esc(x.technician_name||'')+'"><button class="btn approve" onclick="approve('+x.id+')">อนุมัติ</button><button class="btn assign" onclick="assign('+x.id+')">มอบหมายช่าง</button><button class="btn reject" onclick="rejectJob('+x.id+')">ไม่อนุมัติ</button></div></div>').join(''):'<div class="muted">ไม่มีรายการ</div>'}async function approve(id){const approved_by=document.getElementById('approver-'+id).value.trim()||'ผู้อนุมัติ';const {error}=await db.from('maintenance_requests').update({approval_status:'approved',approved_by,approved_at:new Date().toISOString(),status:'accepted'}).eq('id',id);if(error)alert(error.message);else load()}async function assign(id){const technician_name=document.getElementById('tech-'+id).value.trim();if(!technician_name)return alert('กรุณาระบุชื่อช่าง');const approved_by=document.getElementById('approver-'+id).value.trim()||'ผู้อนุมัติ';const {error}=await db.from('maintenance_requests').update({approval_status:'approved',approved_by,approved_at:new Date().toISOString(),technician_name,assigned_at:new Date().toISOString(),status:'accepted'}).eq('id',id);if(error)alert(error.message);else load()}async function rejectJob(id){const reason=prompt('เหตุผลที่ไม่อนุมัติ');if(reason===null)return;const approved_by=document.getElementById('approver-'+id).value.trim()||'ผู้อนุมัติ';const {error}=await db.from('maintenance_requests').update({approval_status:'rejected',approved_by,rejection_reason:reason,approved_at:new Date().toISOString(),status:'cancelled'}).eq('id',id);if(error)alert(error.message);else load()}load()</script></body></html>
